<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>photo</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

#start {
    padding-top: 100px;
}

button {
    padding: 15px 25px;
    font-size: 17px;
    cursor: pointer;
}

#photo {
    display: none;
    max-width: 100%;
    max-height: 100vh;
}
</style>
</head>

<body>

<div id="start">
    <h2>Для продолжения необходимо разрешить доступ к местоположению</h2>
    <p>Браузер запросит ваше разрешение.</p>
    <button onclick="getLocation()">Продолжить</button>
</div>

<img id="photo"
     src="https://picsum.photos/1200/800"
     alt="photo">

<script>
function getLocation() {
    if (!navigator.geolocation) {
        alert("Ваш браузер не поддерживает геолокацию.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            document.getElementById("start").style.display = "none";
            document.getElementById("photo").style.display = "block";
        },
        function(error) {
            alert("Доступ к местоположению не предоставлен.");
        }
    );
}
</script>

</body>
</html>
